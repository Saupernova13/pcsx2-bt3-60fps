# A release PR's note must be finished before it merges.
#
# Merging a release PR publishes, and version.yml refuses to tag a DRAFT note,
# leaving a note on main with no tag that nothing later recovers. This catches it
# on the PR, with the same `tools/version.py verify` used at publish time.
# Make it a required check on main for it to block the merge.
name: Release PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  note:
    name: The version note is written
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # version.py imports export, which imports ps2ee, so the dependencies are needed.
      - name: Check out PCSXROO
        uses: actions/checkout@v5
        with:
          repository: Saupernova13/pcsxroo
          path: _pcsxroo
          ref: master

      - name: Point the tools at PCSXROO
        run: echo "PCSXROO_REPO=${GITHUB_WORKSPACE}/_pcsxroo" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the tools' dependencies
        run: pip install --quiet keystone-engine capstone numpy zstandard

      - name: The note is no longer a scaffold
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          tag="${HEAD_REF#release/}"
          if ! python tools/version.py verify --tag "$tag"; then
            echo "::error file=docs/versions/${tag}.md::Rewrite this note for a player before merging. Merging this PR is what publishes the release, and version.yml will refuse to tag it as it stands."
            exit 1
          fi
          echo "docs/versions/${tag}.md is ready to publish"
