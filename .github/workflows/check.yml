# Pre-merge gate: what ships must export and validate, and every tool must run.
#
# export.py validates the patch, so a malformed or renamed group fails here, not
# mid-release. The smoke step runs every tool with --help; a tool shadowing a
# stdlib module is invisible on Windows and fatal on Linux.
name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: The patch exports and the tools run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # The tools import ps2ee from a sibling checkout of PCSXROO.
      - name: Check out PCSXROO
        uses: actions/checkout@v5
        with:
          repository: Saupernova13/pcsxroo
          path: _pcsxroo
          ref: master

      - name: Point the tools at PCSXROO
        run: echo "PCSXROO_REPO=${GITHUB_WORKSPACE}/_pcsxroo" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ps2ee needs keystone, capstone, numpy and zstandard; the screenshot tools need pillow.
      - name: Install the tools' dependencies
        run: pip install --quiet keystone-engine capstone numpy zstandard pillow

      - name: Export the shipped patch
        run: python tools/export.py --to "${RUNNER_TEMP}/export"

      - name: Report whether a version is owed
        run: python tools/version.py status

      - name: Every tool starts
        run: |
          set -uo pipefail
          failed=0
          for tool in tools/*.py; do
            # _bootstrap is imported by the others, never run on its own.
            [ "$(basename "$tool")" = "_bootstrap.py" ] && continue
            # Bounded, so a tool that waits on the emulator before --help cannot hold the runner.
            if ! out="$(timeout 60 python "$tool" --help 2>&1)"; then
              echo "::error file=${tool}::${tool} does not start"
              echo "$out" | tail -n 20
              failed=1
            fi
          done
          exit "$failed"
