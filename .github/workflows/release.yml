# Publishes a version tag as a GitHub Release with the patch attached, so the
# Releases page is where people download it. See docs/releases.md.
#
# Normally dispatched by version.yml the moment it pushes a tag. It is also the
# recovery route on its own: given a tag that exists, running it by hand from
# the Actions tab publishes or re-publishes that version, so a run that failed
# after the tag was pushed costs nothing but a re-run.
name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, e.g. v23-known-issues-refresh"
        required: true
        type: string

permissions:
  contents: write

# One run per tag. A tag pushed by hand fires the push trigger while version.yml
# dispatches the same tag, and two runs would race on the same release.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    env:
      # Passed through env, never expanded into a script, so a tag name is only data.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Write the release notes
        run: |
          set -euo pipefail
          pnach=patch/428113C2.pnach
          note="docs/versions/${TAG}.md"
          if [ ! -f "$pnach" ]; then
            echo "::error::${TAG} has no ${pnach}; cut it with tools/export.py --release ${TAG}"
            exit 1
          fi
          if [ ! -f "$note" ]; then
            echo "::error::${TAG} has no ${note}; every release carries a version note"
            exit 1
          fi
          # The same test tools/version.py verify applies before tagging, applied
          # again here because a tag pushed by hand never went through that, and
          # what this step writes is what players read.
          if grep -q 'DRAFT' "$note"; then
            echo "::error::${note} still says DRAFT. Rewrite it for a player, then move the tag."
            exit 1
          fi

          head -n 1 "$note" | sed 's/^# *//' > title.txt

          # Relative links in the note point into the repo; a release page needs them absolute.
          base="https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/versions/"
          {
            cat <<'EOF'
          ## Install

          **Download `428113C2.pnach` below.** The "Source code" archives are the
          development repository, not the patch.

          1. Keep the name `428113C2.pnach`. PCSX2 finds a patch by the game's CRC and
             ignores any other name.
          2. Put it in PCSX2's `cheats` folder.
          3. Enable cheats for Budokai Tenkaichi 3 (SLUS-21678) and tick every group
             listed at the top of the file, in the game's Settings -> Cheats.
          4. Quit and relaunch PCSX2. A reset or a save-state load is not enough.

          The top of the file also lists what is still not fixed.

          EOF
            # The note without its title (the release has one) or its git recipe (this page replaces it).
            awk 'NR == 1 { next } /^## Get this version/ { skip = 1; next } /^## / { skip = 0 } !skip' "$note" |
              sed -E "s|\]\(([^)#:][^):]*)\)|](${base}\1)|g"
          } > notes.md

          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Create or update, so a re-run is never a failure. version.yml can
          # push a tag and then fail to dispatch this workflow, which leaves a
          # tag with no Release; running it by hand is the fix, and running it
          # again on a version that is already out must be harmless.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$(cat title.txt)" \
              --notes-file notes.md
            gh release upload "$TAG" patch/428113C2.pnach \
              --repo "$GITHUB_REPOSITORY" --clobber
            echo "updated the existing ${TAG} release"
          else
            gh release create "$TAG" patch/428113C2.pnach \
              --repo "$GITHUB_REPOSITORY" \
              --title "$(cat title.txt)" \
              --notes-file notes.md \
              --verify-tag
            echo "published ${TAG}"
          fi
