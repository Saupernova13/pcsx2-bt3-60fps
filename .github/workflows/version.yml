# Versioning: a merge that changes what ships becomes a version.
#
# A release is a record, so it is never written retroactively onto the PR that
# caused it. After a merge to main this runs two steps, in order:
#
#   1. publish   if the merge just brought in a release PR (head branch
#                `release/...`), its note is final: tag it, and dispatch
#                release.yml to publish the GitHub Release.
#   2. stage     if the shipped patch= lines in wip/working.pnach still differ
#                from patch/, a version is owed: scaffold docs/versions/vNN-*.md,
#                export the patch, and open a release PR. A human rewrites the
#                note; merging that PR is what publishes.
#
# Step 2 also runs straight after step 1. That is what stops a patch merge from
# being stranded when it lands while a release PR is waiting: the release
# publishes, then the next version is staged to carry it.
#
# The test is the exported patch= lines, never file paths. Comment prose, docs
# and tooling can edit wip/working.pnach as much as they like without owing a
# version; only a change PCSX2 would execute counts. Because the test is a diff
# against patch/, a run that fails is not a version lost: the next merge, or a
# manual run, sees the same difference and stages it.
#
# `tools/version.py phase` decides which of the two this run is, so the decision
# has one home and can be checked by hand rather than living in an `if:` here.
# It also makes a manual run (Actions -> Version -> Run workflow) the recovery
# route it is documented to be: with no merged PR to read, phase publishes the
# newest finished note that has no tag, and otherwise stages. Nothing else
# recovers a note that reached main untagged - patch/ already matches by then,
# so no later merge notices it.
name: Version

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # `gh workflow run` to dispatch release.yml is a POST to the workflows
  # dispatches endpoint, which needs actions:write. Without it the publish step
  # tags the version and then fails on the last line, leaving a tag with no
  # Release.
  actions: write

# Serialised: two merges landing together must not both stage a version.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    # A merged PR from a fork is skipped rather than half-run: `pull_request`
    # from a fork gets a read-only token whatever the permissions above say, so
    # nothing here could push a branch or a tag. The version is not lost - it is
    # a diff against patch/ - and a manual run stages it.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0        # the tags, for choosing the next version
          token: ${{ secrets.GITHUB_TOKEN }}

      # The tools import ps2ee from a sibling checkout of PCSXROO.
      - name: Check out PCSXROO
        uses: actions/checkout@v5
        with:
          repository: Saupernova13/pcsxroo
          path: _pcsxroo
          ref: master

      - name: Point the tools at PCSXROO
        run: echo "PCSXROO_REPO=${GITHUB_WORKSPACE}/_pcsxroo" >> "$GITHUB_ENV"

      # ps2ee imports keystone at module load, so export.py cannot run without
      # its dependencies even though nothing here assembles code.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the tools' dependencies
        run: pip install --quiet keystone-engine capstone numpy zstandard

      - name: Report the starting state
        run: python tools/version.py status

      - name: Decide what this run owes
        id: phase
        run: |
          set -euo pipefail
          python tools/version.py phase \
            --head-ref "${HEAD_REF}" --github-output "$GITHUB_OUTPUT"

      # ---- 0. refuse a release PR that merged with an unfinished note --------
      #
      # Red, not a warning. The note is on main, there is no tag, and patch/
      # already matches the tree - so no later merge sees a version owed and
      # every run after this one is a quiet "nothing". A green check is the one
      # thing this state must not look like.
      - name: The merged release note is not finished
        if: steps.phase.outputs.phase == 'blocked'
        env:
          TAG: ${{ steps.phase.outputs.tag }}
        run: |
          set -uo pipefail
          python tools/version.py verify --tag "$TAG"       # prints what is wrong
          echo "::error file=docs/versions/${TAG}.md::${TAG} merged with a note that is still a scaffold. Rewrite it, then run this workflow by hand to publish it."
          exit 1

      # A note on main with no tag, reached any other way: the same dead end,
      # but this run is not the one that caused it, so it is a warning.
      - name: A version is waiting to be published
        if: steps.phase.outputs.phase == 'nothing' && steps.phase.outputs.waiting != ''
        env:
          WAITING: ${{ steps.phase.outputs.waiting }}
        run: |
          echo "::warning file=docs/versions/${WAITING}.md::${WAITING} is on main with no tag, so no version will be staged until it is published. Finish the note, then run this workflow by hand (Actions -> Version -> Run workflow)."

      # ---- 1. publish a release whose note is finished -----------------------
      - name: Publish the release
        id: publish
        if: steps.phase.outputs.phase == 'publish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.phase.outputs.tag }}
        run: |
          set -euo pipefail
          # The note and patch/ both arrived with the merge, so the note
          # describes exactly the file being tagged. Exporting again here would
          # fold in any patch PR that landed in the meantime and leave the note
          # describing a build that is not the one released.
          #
          # phase has already run this, and it runs again because the next line
          # is the irreversible one: a DRAFT tagged is a DRAFT players read.
          python tools/version.py verify --tag "$TAG"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$(head -n 1 "docs/versions/${TAG}.md" | sed 's/^# *//')"
          git push origin "$TAG"
          # A tag pushed with GITHUB_TOKEN does not fire other workflows, so
          # release.yml is dispatched explicitly rather than relying on the tag.
          if ! gh workflow run release.yml --ref main -f tag="$TAG"; then
            echo "::error::tagged ${TAG} but could not dispatch release.yml." \
                 "Publish it with: gh workflow run release.yml --ref main -f tag=${TAG}"
            exit 1
          fi
          echo "published ${TAG}"

      # ---- 2. stage a version if one is owed ----------------------------------
      #
      # Not gated on phase: after a publish, patch/ and the tree can differ
      # again, which phase could not have known when it ran. The script decides
      # for itself and says so when nothing is owed.
      - name: Stage the next version
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
          PUBLISHED: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          # After a publish the merged PR is the release PR, and its body is
          # about the version just published. Seeding the next note from it is
          # how v24's scaffold came to describe a tooling PR instead of the six
          # groups it carried, so nothing is passed and the note is left to its
          # commit list.
          if [ "${PUBLISHED}" = "success" ]; then
            PR_NUMBER="" PR_TITLE="" PR_URL="" PR_BODY=""
          fi
          printf '%s\n' "${PR_BODY}" > "${PR_BODY_FILE}"
          bash .github/scripts/stage-release.sh \
            "${PR_NUMBER}" "${PR_TITLE}" "${PR_URL}" "${PR_BODY_FILE}"

      - name: Done
        if: always()
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
          PHASE_TAG: ${{ steps.phase.outputs.tag }}
          PUBLISHED: ${{ steps.publish.outcome }}
        run: |
          echo "phase:   ${PHASE} ${PHASE_TAG}"
          echo "publish: ${PUBLISHED}"
          # A report, not a check: it must not turn a failed job into a second failure.
          python tools/version.py status || true
