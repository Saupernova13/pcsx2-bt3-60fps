# Versioning: a merge that changes what ships becomes a version.
#
# After a merge to main this runs two steps, in order:
#
#   1. publish   if the merge brought in a release PR (head branch `release/...`),
#                its note is final: tag it, and dispatch release.yml.
#   2. stage     if the shipped patch= lines in wip/working.pnach still differ
#                from patch/, scaffold docs/versions/vNN-*.md, export the patch
#                and open a release PR. A human rewrites the note; merging that
#                PR publishes.
#
# Step 2 also runs after step 1, so a patch merge that landed while a release PR
# was waiting is not stranded. The test is the exported patch= lines only, and a
# failed run loses nothing: the next merge or a manual run sees the same diff.
#
# `tools/version.py phase` decides which step this run is. A manual run (Actions
# -> Version -> Run workflow) is the recovery route: with no merged PR it
# publishes the newest finished untagged note, else stages.
name: Version

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Dispatching release.yml needs actions:write; without it a tag is pushed with no Release.
  actions: write

# Serialised: two merges landing together must not both stage a version.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    # Fork PRs get a read-only token and could not push; a manual run stages the version.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0        # the tags, for choosing the next version
          token: ${{ secrets.GITHUB_TOKEN }}

      # The tools import ps2ee from a sibling checkout of PCSXROO.
      - name: Check out PCSXROO
        uses: actions/checkout@v5
        with:
          repository: Saupernova13/pcsxroo
          path: _pcsxroo
          ref: master

      - name: Point the tools at PCSXROO
        run: echo "PCSXROO_REPO=${GITHUB_WORKSPACE}/_pcsxroo" >> "$GITHUB_ENV"

      # ps2ee imports keystone at module load, so export.py needs the dependencies.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the tools' dependencies
        run: pip install --quiet keystone-engine capstone numpy zstandard

      - name: Report the starting state
        run: python tools/version.py status

      - name: Decide what this run owes
        id: phase
        run: |
          set -euo pipefail
          python tools/version.py phase \
            --head-ref "${HEAD_REF}" --github-output "$GITHUB_OUTPUT"

      # ---- 0. refuse a release PR that merged with an unfinished note --------
      #
      # Red, not a warning: a note on main with no tag is a state nothing later recovers.
      - name: The merged release note is not finished
        if: steps.phase.outputs.phase == 'blocked'
        env:
          TAG: ${{ steps.phase.outputs.tag }}
        run: |
          set -uo pipefail
          python tools/version.py verify --tag "$TAG"       # prints what is wrong
          echo "::error file=docs/versions/${TAG}.md::${TAG} merged with a note that is still a scaffold. Rewrite it, then run this workflow by hand to publish it."
          exit 1

      # The same dead end reached another way; this run did not cause it, so a warning.
      - name: A version is waiting to be published
        if: steps.phase.outputs.phase == 'nothing' && steps.phase.outputs.waiting != ''
        env:
          WAITING: ${{ steps.phase.outputs.waiting }}
        run: |
          echo "::warning file=docs/versions/${WAITING}.md::${WAITING} is on main with no tag, so no version will be staged until it is published. Finish the note, then run this workflow by hand (Actions -> Version -> Run workflow)."

      # ---- 1. publish a release whose note is finished -----------------------
      - name: Publish the release
        id: publish
        if: steps.phase.outputs.phase == 'publish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.phase.outputs.tag }}
        run: |
          set -euo pipefail
          # Do not re-export: the note and patch/ arrived together with the merge.
          # Verify again because tagging is irreversible.
          python tools/version.py verify --tag "$TAG"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$(head -n 1 "docs/versions/${TAG}.md" | sed 's/^# *//')"
          git push origin "$TAG"
          # A tag pushed with GITHUB_TOKEN fires no workflows, so dispatch explicitly.
          if ! gh workflow run release.yml --ref main -f tag="$TAG"; then
            echo "::error::tagged ${TAG} but could not dispatch release.yml." \
                 "Publish it with: gh workflow run release.yml --ref main -f tag=${TAG}"
            exit 1
          fi
          echo "published ${TAG}"

      # ---- 2. stage a version if one is owed ----------------------------------
      #
      # Not gated on phase: after a publish the tree can differ again. The script decides.
      - name: Stage the next version
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
          PUBLISHED: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          # After a publish the merged PR is the release PR, so do not seed the next
          # note from it; leave the note to its commit list.
          if [ "${PUBLISHED}" = "success" ]; then
            PR_NUMBER="" PR_TITLE="" PR_URL="" PR_BODY=""
          fi
          printf '%s\n' "${PR_BODY}" > "${PR_BODY_FILE}"
          bash .github/scripts/stage-release.sh \
            "${PR_NUMBER}" "${PR_TITLE}" "${PR_URL}" "${PR_BODY_FILE}"

      - name: Done
        if: always()
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
          PHASE_TAG: ${{ steps.phase.outputs.tag }}
          PUBLISHED: ${{ steps.publish.outcome }}
        run: |
          echo "phase:   ${PHASE} ${PHASE_TAG}"
          echo "publish: ${PUBLISHED}"
          # A report, not a check: it must not turn a failed job into a second failure.
          python tools/version.py status || true
